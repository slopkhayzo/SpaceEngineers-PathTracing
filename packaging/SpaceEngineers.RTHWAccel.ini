; SpaceEngineers.RTHWAccel settings.
; Values are read once, when the game starts.

[General]
; false switches the plugin off without removing it.
Enabled = true
; true writes statistics of the ray tracing (frame times, the traced scene,
; the light sampling) to the log every five seconds. Turn it on before
; reproducing a problem you want to report.
Diagnostics = false

[RayTracing]
; What lights the scene:
;   replace = path-traced light on every surface the game draws
;             (recommended)
;   overlay = path-traced light only where the traced scene matches the
;             game's; the game's own lighting elsewhere
;   off     = the game's own lighting (the plugin stays loaded and idle)
GateMode = replace
; What denoises the ray-traced light: auto (DLSS Ray Reconstruction on
; NVIDIA RTX GPUs, the plugin's own filter elsewhere), rr (Ray
; Reconstruction), filter (the plugin's own filter: cheaper, noisier in
; motion).
Denoiser = auto
; Characters' glowing suit parts (stripes, wrist and shoulder lights) light
; their surroundings, the player's own suit too; false: they only glow
; where they are seen, as in the game.
CharacterLights = true
; Glowing decals (indicator lights and signs painted on blocks) light their
; surroundings; false: they only glow where they are seen, as in the game.
DecalLights = true
; Lamps and glowing surfaces light their surroundings with traced light at
; any distance; false: within 32 m of the camera (beyond it the game's own
; lamp light, without shadows; a little cheaper).
LightTree = true
; The DLSS mode of Ray Reconstruction (with Denoiser = auto or rr on NVIDIA RTX
; GPUs, GateMode = replace): dlaa traces the light at the game's resolution;
; quality, balanced, performance and ultra-performance trace it smaller (about
; 67, 58, 50 and 33 % of the width and height) and let Ray Reconstruction
; upscale it: cheaper, softer. The game's own rendering keeps its resolution.
DlssMode = dlaa
; DLSS Frame Generation: a frame made between each two the game draws (the
; Path tracing screen's switch). Needs an NVIDIA GeForce RTX 40 or 50 series
; GPU, Windows' hardware-accelerated GPU scheduling and Ray Reconstruction
; (Denoiser = auto or rr). RivaTuner's on-screen display slows it down a lot:
; set RivaTuner's application detection level to None for SpaceEngineers.exe
; while using it.
FrameGeneration = false
; Multipliers of the light, 0 to 100 (1: as the game sets its lights;
; above 1: brighter).
; LampIntensity: the game's lamps (interior lights, spotlights, ...),
; traced (with LightTree = false within 32 m of the camera, and the game's
; own lamp light beyond, so the two meet without a step).
; EmissiveIntensity: the light that screens, keypads and glowing strips
; cast on their surroundings; their own glow stays as the game draws it.
LampIntensity = 1.0
EmissiveIntensity = 1.0
