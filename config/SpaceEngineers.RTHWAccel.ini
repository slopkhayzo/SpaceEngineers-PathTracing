; Development default, copied beside the plugin on every build.
; The release INI is packaging/SpaceEngineers.RTHWAccel.ini.

[General]
Enabled = true
Diagnostics = true

[RayTracing]
; Phase 0b gate in front of the game's lighting: off, roundtrip (cross-device
; fence hand-off only), overlay (the debug view blended by the patched sun
; pass; the lit views where the traced depth matches the game's), replace (the
; lit views on every surface pixel, with jittered primary rays for
; anti-aliasing; the other views replace the lit frame).
GateMode = overlay
; What the D3D12 debug view shows: stripes, normals, basecolor, worldgrid,
; reprojection (camera check: depth reprojected into the previous frame);
; primary rays through the scene mirror: parts (a color per mesh part),
; mismatch (ray depth against the game's depth), faces (front/back), clay
; (white surfaces, traced sun shadows and sky occlusion), material (traced
; base color), materialcompare (traced material against the G-buffer's), paths
; (how each object reaches the mirror: models, cube blocks, deformed armor),
; lit (traced light in place of the game's sun, ambient and emissive light,
; with GateMode = overlay; denoised), lit-raw (the same before the spatial
; filter), emitters (the light of emissive surfaces alone), motion (each pixel's
; motion since the previous frame), lit-rr (lit with DLSS Ray Reconstruction),
; lit-filter (lit with our filter), emitters-reference (emitters without
; reusing light samples: the reference their average must match),
; emitters-power-grid (emitters with the earlier light grid, which drew its
; lights by power alone), lit-fsr (lit with our filter, then AMD FSR, with
; GateMode = replace).
DebugView = stripes
; What denoises the lit view's traced light: auto (DLSS Ray Reconstruction on
; NVIDIA RTX GPUs, our own filter elsewhere), rr (Ray Reconstruction; our
; filter when it is unavailable), filter (our filter: about 2 ms cheaper at
; 1080p on an RTX 4090, noisier in motion).
Denoiser = auto
; Characters' glowing suit parts (stripes, wrist and shoulder lights) light
; their surroundings, the player's own suit too; false: they only glow where
; they are seen, as in the game.
CharacterLights = true
; Glowing decals (indicator lights and signs painted on blocks) light their
; surroundings; false: they only glow where they are seen, as in the game.
DecalLights = true
; Lamps and glowing surfaces light their surroundings with traced light at any
; distance (the light grid's coarser cells farther out, filled from a light
; tree). false: 32 m around the camera (beyond it the game's own lamp light,
; without shadows).
LightTree = true
; The upscaling mode (GateMode = replace; DlssMode before 0.5.0, still read):
; native traces the light at the game's resolution (DLAA with Ray
; Reconstruction, FSR's native AA); quality, balanced, performance and
; ultra-performance trace it smaller (about 67, 58, 50 and 33 % of the width
; and height) and let Ray Reconstruction, or AMD FSR after our filter, upscale
; it: cheaper, softer. The game's own rendering keeps its resolution.
UpscalingMode = native
; What upscales the light our filter denoised (Ray Reconstruction upscales by
; itself): auto (AMD FSR where available), fsr, off (our filter alone, at the
; game's resolution). AMD's loader takes FSR 4 on the Radeons it supports,
; FSR 3.1 on other GPUs; not tested on AMD GPUs.
Upscaler = auto
; AMD FSR's sharpening, 0 (off) to 1.
FsrSharpness = 0.0
; Troubleshooting: FsrVersion = 3 makes AMD's loader take the newest FSR 3.x
; instead of FSR 4 (by the start of the version's name; empty or auto: the
; newest).
FsrVersion =
; Frame generation: a frame made between each two the game draws (the Path
; tracing screen's choice), with any denoiser. off; dlss: DLSS Frame
; Generation (an NVIDIA GeForce RTX 40 or 50 series GPU and Windows'
; hardware-accelerated GPU scheduling); fsr: AMD FSR Frame Generation (any GPU
; the plugin runs on; not tested on AMD GPUs); auto: DLSS where it runs, else
; FSR. true (0.4.0's switch) reads as auto. RivaTuner's on-screen display slows
; frame generation down a lot: set RivaTuner's application detection level to
; None for SpaceEngineers.exe while using it.
FrameGeneration = off
; Multipliers of the light, 0 to 100 (1: as the game sets its lights).
; LampIntensity: the game's lamps (point and spot lights), traced, and the
; game's own lamp light beyond the traced area (with LightTree = false, 32 m
; around the camera), so the two meet without a step. EmissiveIntensity: the light emissive surfaces
; (screens, keypads, glowing strips) cast on what is around them; their own
; glow where they are seen stays as the game draws it.
LampIntensity = 1.0
EmissiveIntensity = 1.0
PatternStrength = 0.5
PatchShaders = true
; Walk the render scene every frame into the BLAS/TLAS mirror (phase 2).
SceneMirror = true

[Debug]
AutoLoadWorld =
AutoQuitSeconds = 0
TracePath =
CapturePath =
; Once the world is ready: every debug view and gate mode in turn, with
; screenshots and timings; the spectator orbits the player meanwhile.
InspectorSequence = false
; Before the inspector: the player character sits in the nearest free cockpit,
; so that the first views look out through its canopy.
SeatInCockpit = false
; After the inspector (if any): bullet holes where the player's view meets a
; grid (the game's own decals, as a rifle leaves them), then the game's frame,
; the traced base color, its comparison with the G-buffer and the traced light,
; with screenshots.
TestDecals = false
; Then, per armor skin listed (subtypes, comma-separated, e.g. Corrugated,
; Hazard_Armor; block:<subtype> for a block type, e.g. block:Collector): the
; spectator 3 m from the nearest block with it, the game's frame, the traced
; base color, its comparison with the G-buffer and the traced light, with
; screenshots. view:<subtype>@<eye>><target>|<point>|...: the spectator at
; <eye> in the model space of the nearest block of that type (metres, "x y z"),
; looking at <target>; probes (up to 8) where the points lie, which log the
; triangles their rays cross; the game's frame, base color, its comparison,
; parts and traced light.
LookAtSkins =
; After them: the game's options screen with the plugin's "Path tracing" button,
; the plugin's screen over it and its DLSS mode changed through it, with
; screenshots that include the menus.
TestMenu = false
; The transparent pass's parts (glass, holograms, shields) in the traced scene
; as opaque surfaces, as before (they stop the rays): for comparisons only.
MirrorTransparent = false
; The D3D12 debug layer on the plugin's device, for finding what one vendor's
; driver forgives and another's may not: off, on, gpu (with GPU-based
; validation of resource states: slower), gpu-full (every shader access
; validated: the first traced frames take minutes). Its warnings and errors go
; to this log, with DRED's account of a device removal. Needs Windows'
; optional feature "Graphics Tools".
D3D12Validation = off
; How the game's geometry reaches D3D12: auto (a buffer D3D11 shares with a
; legacy handle; checked at the first gates, and if its bytes do not arrive, a
; texture D3D11 shares with an NT handle instead), legacy (the buffer only) or
; texture (the fallback, for testing it).
GeometryTransport = auto
; Who presents the game's frames: game (its own D3D11 swap chain; empty: game)
; or d3d12 (the native core's D3D12 flip-model swap chain on the game's window,
; the base of frame generation; exclusive full screen falls back to the game's).
Presenter =
; Frame generation for tests, over [RayTracing] FrameGeneration (empty: that):
; off, auto, dlss (or on), fsr, streamline (presented through Streamline with
; DLSS-G off: the integration's check) or fsr-chain (through AMD FSR's frame
; generation swap chain with its generation off).
FrameGeneration =
; Frame generation's checks: the game window brought to the foreground once the
; world is ready (DLSS-G pauses while it is not); Reflex's frame limit in frames
; per second (0: none); our presents' sync interval (empty: the game's; 0; 1);
; Reflex's mode (empty: low latency; off; boost); the render thread and
; Streamline's present thread sampled every millisecond, by module (where their
; time goes; reported every five seconds).
Foreground = false
; Seconds frame generation waits once traced frames come back after a loading
; screen or the main menu (empty: 10; 0: none).
FrameGenWarmUp =
FrameLimit = 0
PresentSync =
FrameGenReflex =
SampleThreads = false
; Unattended runs: halfway through AutoQuitSeconds, the game window as Windows
; composes it saved to CapturePath (window-d3d12.png or window-game.png).
CaptureWindow = false
; When the gate records its D3D12 commands: before the hand-off of the game's
; D3D11 work to D3D12 (empty: the default; the driver submits the game's work
; meanwhile, about 1.4 ms of the render thread less in Sparks of the Future),
; after it (as before), alternate (by turns per report window, for
; comparisons).
HandOffOrder =
; Worker threads the scene walk reads the game's objects on, besides the render
; thread: 0 none; empty: automatic (a quarter of the logical processors, at
; most 4, with 8 or more of them, else none); alternate: automatic, used by
; turns per report window (comparisons).
WalkWorkers =
; The game's spectator camera as a photo camera in worlds this machine runs
; (single player or hosted), also survival worlds that do not allow it: F8
; flies freely from where the world last left its spectator (F7 first moves it
; to the character), F6 returns to the character. While flying: W/A/S/D, Space
; up, Ctrl down, Shift 5x faster, Alt 5x slower, Q/E roll, the mouse wheel
; zooms (the field of view; yours returns with F6). Nothing is saved to the
; world or the options. In unattended runs the F8 handler, the zoom and the
; screenshot key's shot from there are checked.
FreeCamera = false
; Keys (F1-F24, A-Z, 0-9, Pause, ScrollLock, after Ctrl+, Shift+ or Alt+ if
; wanted; empty: none). The game uses F1 and F3-F11 (F11: a debug screen) and
; the free camera Ctrl, Shift and Alt, which leaves F2 and F12 (also Steam's
; screenshot key, which then takes one with the HUD too). ScreenshotKey saves
; the frame without the HUD as a PNG in the game folder's Screenshots (beside
; Bin64; the game's own F4 keeps the HUD and saves to
; %APPDATA%\SpaceEngineers\Screenshots). TracingToggleKey switches the traced
; light off (the game's own look, its lamps unscaled too) and on again, for
; before/after shots.
ScreenshotKey = F12
TracingToggleKey = F2
; Up to 8 pixels, "x,y x,y ...", whose rays the inspector's material views log
; in detail (object, record, pattern offset, UV, material, both colors).
Probes =
