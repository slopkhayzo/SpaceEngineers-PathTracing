; Development default, copied beside the plugin on every build.
; The release INI is packaging/SpaceEngineers.RTHWAccel.ini.

[General]
Enabled = true
Diagnostics = true

[RayTracing]
; Phase 0b gate in front of the game's lighting: off, roundtrip (cross-device
; fence hand-off only), overlay (the debug view blended by the patched sun
; pass; the lit views where the traced depth matches the game's), replace (the
; lit views on every surface pixel, with jittered primary rays for
; anti-aliasing; the other views replace the lit frame).
GateMode = overlay
; What the D3D12 debug view shows: stripes, normals, basecolor, worldgrid,
; reprojection (camera check: depth reprojected into the previous frame);
; primary rays through the scene mirror: parts (a color per mesh part),
; mismatch (ray depth against the game's depth), faces (front/back), clay
; (white surfaces, traced sun shadows and sky occlusion), material (traced
; base color), materialcompare (traced material against the G-buffer's), paths
; (how each object reaches the mirror: models, cube blocks, deformed armor),
; lit (traced light in place of the game's sun, ambient and emissive light,
; with GateMode = overlay; denoised), lit-raw (the same before the spatial
; filter), emitters (the light of emissive surfaces alone), motion (each pixel's
; motion since the previous frame), lit-rr (lit with DLSS Ray Reconstruction),
; lit-filter (lit with our filter), emitters-reference (emitters without
; reusing light samples: the reference their average must match),
; emitters-power-grid (emitters with the earlier light grid, which drew its
; lights by power alone).
DebugView = stripes
; What denoises the lit view's traced light: auto (DLSS Ray Reconstruction on
; NVIDIA RTX GPUs, our own filter elsewhere), rr (Ray Reconstruction; our
; filter when it is unavailable), filter (our filter: about 2 ms cheaper at
; 1080p on an RTX 4090, noisier in motion).
Denoiser = auto
; Characters' glowing suit parts (stripes, wrist and shoulder lights) light
; their surroundings, the player's own suit too; false: they only glow where
; they are seen, as in the game.
CharacterLights = true
; Glowing decals (indicator lights and signs painted on blocks) light their
; surroundings; false: they only glow where they are seen, as in the game.
DecalLights = true
; Multipliers of the light, 0 to 100 (1: as the game sets its lights).
; LampIntensity: the game's lamps (point and spot lights), traced, and the
; game's own lamp light beyond the traced area (32 m around the camera), so
; the two meet without a step. EmissiveIntensity: the light emissive surfaces
; (screens, keypads, glowing strips) cast on what is around them; their own
; glow where they are seen stays as the game draws it.
LampIntensity = 1.0
EmissiveIntensity = 1.0
PatternStrength = 0.5
PatchShaders = true
; Walk the render scene every frame into the BLAS/TLAS mirror (phase 2).
SceneMirror = true

[Debug]
AutoLoadWorld =
AutoQuitSeconds = 0
TracePath =
CapturePath =
; Once the world is ready: every debug view and gate mode in turn, with
; screenshots and timings; the spectator orbits the player meanwhile.
InspectorSequence = false
; Before the inspector: the player character sits in the nearest free cockpit,
; so that the first views look out through its canopy.
SeatInCockpit = false
; After the inspector (if any): bullet holes where the player's view meets a
; grid (the game's own decals, as a rifle leaves them), then the game's frame,
; the traced base color, its comparison with the G-buffer and the traced light,
; with screenshots.
TestDecals = false
; Then, per armor skin listed (subtypes, comma-separated, e.g. Corrugated,
; Hazard_Armor; block:<subtype> for a block type, e.g. block:Collector): the
; spectator 3 m from the nearest block with it, the game's frame, the traced
; base color, its comparison with the G-buffer and the traced light, with
; screenshots.
LookAtSkins =
; The transparent pass's parts (glass, holograms, shields) in the traced scene
; as opaque surfaces, as before (they stop the rays): for comparisons only.
MirrorTransparent = false
; The game's spectator camera as a photo camera in worlds this machine runs
; (single player or hosted), also survival worlds that do not allow it: F8
; flies freely from where the world last left its spectator (F7 first moves it
; to the character), F6 returns to the character. While flying: W/A/S/D, Space
; up, Ctrl down, Shift 5x faster, Alt 5x slower, Q/E roll, the mouse wheel
; zooms (the field of view; yours returns with F6). Nothing is saved to the
; world or the options. In unattended runs the F8 handler, the zoom and the
; screenshot key's shot from there are checked.
FreeCamera = false
; Keys (F1-F24, A-Z, 0-9, Pause, ScrollLock, after Ctrl+, Shift+ or Alt+ if
; wanted; empty: none). The game uses F1 and F3-F11 (F11: a debug screen) and
; the free camera Ctrl, Shift and Alt, which leaves F2 and F12 (also Steam's
; screenshot key, which then takes one with the HUD too). ScreenshotKey saves
; the frame without the HUD as a PNG in the game folder's Screenshots (beside
; Bin64; the game's own F4 keeps the HUD and saves to
; %APPDATA%\SpaceEngineers\Screenshots). TracingToggleKey switches the traced
; light off (the game's own look, its lamps unscaled too) and on again, for
; before/after shots.
ScreenshotKey = F12
TracingToggleKey = F2
; Up to 8 pixels, "x,y x,y ...", whose rays the inspector's material views log
; in detail (object, record, pattern offset, UV, material, both colors).
Probes =
